    /* Self-contained: GitHub Pages serves this file at any missing path, so

    :root {
      --font: -apple-system, BlinkMacSystemFont, "Inter Var", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --spring: cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    @supports (transition-timing-function: linear(0, 1)) {
      :root { --spring: linear(0, 0.0535 4%, 0.1694 8%, 0.3375 13%, 0.5509 20%, 0.7298 28%, 0.865 38%, 0.9445 50%, 0.9827 65%, 0.9965 85%, 1); }
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #050607; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 1.5rem;
      font-family: var(--font);
      color: #fff;
      background: radial-gradient(70% 60% at 50% 45%, #14181d 0%, #0a0c0f 50%, #050607 100%);
      -webkit-font-smoothing: antialiased;
    }
    main { display: grid; justify-items: center; gap: 1.5rem; text-align: center; }
    /* A display with no input: a dark panel, a faint scan of light, the mark. */
    .screen {
      position: relative;
      display: grid;
      place-items: center;
      width: min(80vw, 30rem);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 1rem;
      background: linear-gradient(180deg, #0d1013, #08090b);
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.1), 0 40px 80px -40px rgb(0 0 0 / 0.9), 0 0 6rem -1rem rgb(207 220 255 / 0.12);
    }
    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, rgb(255 255 255 / 0.025) 0 1px, transparent 1px 3px);
    }
    .screen::after {
      content: "";
      position: absolute;
      inset: -40% 0;
      background: linear-gradient(180deg, transparent 40%, rgb(207 220 255 / 0.08) 50%, transparent 60%);
      animation: scan 3.2s 0.6s var(--spring) 1 both;
    }
    @keyframes scan { from { transform: translateY(-40%); } to { transform: translateY(40%); } }
    .screen svg { width: 24%; fill: url(#t); filter: drop-shadow(0 0 1.5rem rgb(207 220 255 / 0.3)); opacity: 0.9; }
    .code { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #737f8b; }
    h1 { margin: 0; font-size: clamp(2.5rem, 1.5rem + 5vw, 4.5rem); font-weight: 600; line-height: 1; letter-spacing: -0.04em; }
    p { max-width: 26rem; margin: 0; font-size: 1.125rem; line-height: 1.45; color: #939da7; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.8rem 1.4rem;
      border-radius: 999px;
      font-size: 0.9375rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      background: rgb(255 255 255 / 0.1);
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.16), inset 0 0 0 1px rgb(255 255 255 / 0.1);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      transition: background-color 0.2s ease;
    }
    a:hover { background: rgb(255 255 255 / 0.16); }
    a:active { scale: 0.97; transition-duration: 0s; }
    a:focus-visible { outline: 2px solid #4c9bff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .screen::after { animation: none; opacity: 0; } }
